<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- Calculator Full Container -->
    <div class="calculator">
        <!--Result Display Screen -->
        <input type="text" id="display" readonly>

        <!-- Buttons Grid Container (Inga than CSS Grid varappothu)-->
         <div class="buttons">
            <button class="operator">C</button>
            <button class="operator">/</button>
            <button class="operator">*</button>
            <button class="operator">-</button>

            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button class="operator">+</button>

            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button class="equal">=</button>

            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button>0</button>
         </div>
    </div>

    <!-- Files Connection Linking -->
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</body>
</html>
